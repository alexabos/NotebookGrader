[project]
name = "notebookgrader"
version = "0.1.0"
description = "CLI tool that automatically grades Jupyter notebook submissions using Claude AI"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "gradio>=6.26.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.11.1",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "python-dotenv>=1.0.0",
    "seaborn>=0.13.2",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
